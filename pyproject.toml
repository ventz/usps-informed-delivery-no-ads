[project]
name = "usps-informed-delivery-cleaner"
version = "0.1.0"
description = "Strip advertising out of USPS Informed Delivery digests and re-send a clean email"
requires-python = ">=3.11"

# uv is the single source of truth for dependencies. `[project.dependencies]` is
# exactly what ships to Lambda; tools/deploy.sh exports it to the requirements.txt
# Chalice insists on reading (generated, gitignored — never edit it by hand).
# boto3 is a dev dep: the Lambda runtime already provides it.
dependencies = [
    "beautifulsoup4==4.14.3",
    "soupsieve==2.8",
    "openai==2.9.0",
]

[dependency-groups]
dev = [
    "chalice>=1.32.0",
    "pytest>=8",
    "boto3",
]
